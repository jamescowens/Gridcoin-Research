# TEMPORARY PROBE -- not for merge.
# What macOS minimum do Homebrew's arm64 bottles carry on macos-15?
name: PROBE arm floor
on:
  push:
    branches: [ci/probe-arm-floor]
  workflow_dispatch:
jobs:
  arm-floor:
    runs-on: macos-15
    steps:
      - name: What does Homebrew give us, and what floor does it carry?
        run: |
          set -euo pipefail
          echo "runner: $(uname -m) macOS $(sw_vers -productVersion)"
          brew install qtbase openssl@3 2>&1 | grep -iE "Pouring|Building from source" | head -4
          for lib in "$(brew --prefix qtbase)/lib/QtCore.framework/Versions/A/QtCore" \
                     "$(brew --prefix openssl@3)/lib/libssl.dylib"; do
            echo "--- $lib"
            otool -l "$lib" | grep -A4 LC_BUILD_VERSION | grep -E "minos|sdk" | head -2
          done
          echo "=== and what a 14.0-targeted binary against them would claim ==="
          cat > /tmp/t.cpp <<'CPP'
          #include <QtCore/QCoreApplication>
          int main(int c, char** v){ QCoreApplication a(c,v); return 0; }
          CPP
          clang++ -std=c++17 -mmacosx-version-min=14.0 \
            -F"$(brew --prefix qtbase)/lib" -framework QtCore \
            -I"$(brew --prefix qtbase)/lib/QtCore.framework/Headers" /tmp/t.cpp -o /tmp/t
          echo "our binary:"; otool -l /tmp/t | grep -A4 LC_BUILD_VERSION | grep minos | head -1
          echo "QtCore it links:"; otool -l "$(brew --prefix qtbase)/lib/QtCore.framework/Versions/A/QtCore" | grep -A4 LC_BUILD_VERSION | grep minos | head -1
